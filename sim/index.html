<!doctype html>
<html lang="en" data-theme="mission-control">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Dinner Tower · for Alexa+</title>
    <meta name="theme-color" content="#07090D" />
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%2307090D'/%3E%3Crect x='9' y='8' width='14' height='16' rx='2' fill='none' stroke='%23F5A524' stroke-width='2'/%3E%3Cpath d='M13 13h6M13 17h6M13 21h3' stroke='%23F5A524' stroke-width='2' stroke-linecap='round'/%3E%3C/svg%3E" />
    <link rel="stylesheet" href="/src/styles.css" />
  </head>
  <body>
    <div class="stage" id="stage">
      <header class="topbar">
        <div class="brand">
          <span class="brand-word">Dinner Tower</span>
          <span class="brand-tag">for Alexa+</span>
        </div>
        <div class="topbar-right">
          <div id="clock-control" class="clock-pill" hidden>
            <span class="clock-label">Demo clock</span>
            <span id="clock-value" class="clock-value">--:--</span>
          </div>
        </div>
      </header>

      <main class="stage-main">
        <section class="device">
          <div class="device-frame">
            <div class="screen">
              <div id="idle" class="idle">
                <div id="idle-time" class="idle-time">--:--</div>
                <p class="idle-hint">
                  Try: <span class="idle-say">&ldquo;Alexa, plan Thanksgiving dinner for 7 PM&rdquo;</span>
                </p>
                <div id="idle-chips" class="idle-chips" data-testid="example-chips"></div>
              </div>
              <div id="app-view" class="app-view" data-testid="app-view" hidden></div>
              <div id="elicitation" class="elicitation" data-testid="elicitation-card" hidden>
                <div class="elicitation-card" role="dialog" aria-modal="true" aria-labelledby="elicitation-message">
                  <p id="elicitation-message" class="elicitation-message" data-testid="elicitation-message"></p>
                  <div id="elicitation-fields" class="elicitation-fields"></div>
                  <button id="elicitation-cancel" class="btn btn-quiet elicitation-cancel" type="button">
                    Not now
                  </button>
                </div>
              </div>
            </div>
            <div class="lightbar" id="lightbar" aria-hidden="true"></div>
          </div>
          <div class="serve-flash" id="serve-flash" data-testid="serve-flash" aria-live="polite" hidden>
            <span class="serve-flash-label">Serve</span>
            <span class="serve-flash-time" id="serve-flash-time"></span>
          </div>
        </section>

        <aside class="conversation" data-testid="conversation">
          <header class="conversation-head">
            <span>Conversation</span>
            <span class="conversation-sub" id="agent-model" data-testid="agent-model"></span>
          </header>
          <div id="feed" class="feed" data-testid="feed"></div>
          <form id="agent-panel" class="composer" data-testid="agent-panel" autocomplete="off" data-busy="false">
            <input
              id="agent-input"
              class="composer-input"
              data-testid="agent-input"
              type="text"
              placeholder="Say something to Alexa…"
              aria-label="Say something to Alexa"
            />
            <button id="agent-send" class="btn composer-send" data-testid="agent-send" type="submit">
              Ask
            </button>
          </form>
        </aside>
      </main>

      <footer class="footer">Simulated Alexa+ experience · unofficial demo</footer>
    </div>

    <aside class="dev-panel" id="dev-panel" data-testid="dev-panel" hidden>
      <header class="dev-head">
        <span>Developer</span>
        <span class="dev-note">?dev=1</span>
      </header>

      <div id="badge" class="badge" data-testid="connection-badge">connecting…</div>

      <section class="dev-block">
        <div class="panel-title">Agent mode</div>
        <div id="agent-hint" class="agent-hint" data-testid="agent-hint" hidden></div>
        <label class="agent-voice">
          <input id="voice-toggle" data-testid="voice-toggle" type="checkbox" checked />
          <span class="check-box" aria-hidden="true"></span>
          <span>Speak replies</span>
        </label>
      </section>

      <section class="dev-block">
        <div class="panel-title">Quick actions</div>
        <div id="presets" class="presets" data-testid="presets"></div>
      </section>

      <section class="dev-block">
        <div class="panel-title">Tools <span id="tool-count" class="count">0</span></div>
        <div id="tools" class="tools" data-testid="tool-list"></div>
      </section>

      <section class="dev-block" id="clock-dev" hidden>
        <div class="panel-title">Demo clock</div>
        <div class="clock-control">
          <input id="clock-input" class="clock-input" type="time" step="60" aria-label="Demo clock time" />
          <button id="clock-set" class="btn btn-quiet" type="button">Set</button>
        </div>
      </section>

      <details class="console" id="console">
        <summary>Tool console</summary>
        <div class="console-body">
          <select id="console-tool" class="console-tool" aria-label="Tool"></select>
          <textarea id="console-args" class="console-args" spellcheck="false" rows="4" aria-label="Arguments JSON">{}</textarea>
          <button id="console-call" class="btn" type="button">Call tool</button>
          <div id="console-error" class="console-error" hidden></div>
        </div>
      </details>
    </aside>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
